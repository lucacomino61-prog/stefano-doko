  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EFE6D2">
  <meta name="color-scheme" content="only light">
  <!-- no phone numbers read into the clock, the prices or the dates (iOS, Android) -->
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Google Search shows the icon beside the result: it needs a square icon at a multiple of 48 px -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/fonts/Anybody-VF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-VF-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- one sheet replaces the last: said here, in the page itself, so the new
       sheet has opted in before anything else of it has loaded -->
  <style>@view-transition { navigation: auto; }</style>
  <script>document.documentElement.classList.add('js');try{if(localStorage.getItem('sd-still')==='1')document.documentElement.classList.add('no-motion')}catch(e){}</script>
  <!-- the night edition (src/ui/night.js), set before the first paint so a dark sheet never flashes light -->
  <script>try{if(localStorage.getItem('sd-night')==='1'){document.documentElement.classList.add('is-night');document.querySelector('meta[name="theme-color"]').content='#16140F';document.querySelector('meta[name="color-scheme"]').content='dark'}}catch(e){}</script>
