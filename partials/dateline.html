      <div class="dateline">
        <p class="dateline__date" data-date>Wednesday, 23 September 2026</p>
        <p class="dateline__price" data-i18n="price">Price: one email</p>
        <p class="dateline__clock"><span data-i18n="zone">Albania</span> <time class="clock" data-clock>12:00</time></p>
        <div class="dateline__ctrl">
          <button class="dateline__night" type="button" data-night aria-pressed="false" aria-label="Night edition" data-i18n-attr="aria-label:nightName"><svg aria-hidden="true"><use href="#sun"/></svg></button>
          <button class="word word--btn" type="button" data-sound aria-pressed="false"><span data-sound-label>Sound off</span></button>
          <button class="word word--btn" type="button" data-proof aria-pressed="false"><span data-proof-label>Proof</span></button>
          <button class="word word--btn" type="button" data-print hidden><span data-i18n="print">Print a copy</span></button>
          <button class="word word--btn" type="button" data-still aria-pressed="false" aria-label="Stop the press: stop animations" data-i18n-attr="aria-label:stillName"><span data-still-label data-i18n="still">Stop the press</span></button>
        </div>
        <aside class="proof-note proof-note--clock" data-note="clock"><span>The clock keeps Albania time.</span></aside>
      </div>
