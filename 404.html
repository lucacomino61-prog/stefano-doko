<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="notFoundTitle">Sheet not found, Stefano Doko</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#EFE6D2">
  <meta name="color-scheme" content="only light">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/Anybody-VF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-VF-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>document.documentElement.classList.add('js');</script>
  <!-- a reader who chose the night edition gets this sheet dark too (src/ui/night.js) -->
  <script>try{if(localStorage.getItem('sd-night')==='1'){document.documentElement.classList.add('is-night');document.querySelector('meta[name="theme-color"]').content='#16140F'}}catch(e){}</script>
</head>
<body class="lost">
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="star" viewBox="0 0 24 24">
        <rect x="10.55" y="2" width="2.9" height="20" rx="1.45"/>
        <rect x="10.55" y="2" width="2.9" height="20" rx="1.45" transform="rotate(60 12 12)"/>
        <rect x="10.55" y="2" width="2.9" height="20" rx="1.45" transform="rotate(-60 12 12)"/>
      </symbol>
      <symbol id="hand" viewBox="0 0 128 64">
        <path d="M10 32H116M92 9l24 23-24 23" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" style="stroke-width: var(--arrow-w, 1.8px)"/>
      </symbol>
    </defs>
  </svg>
  <header class="toolbar toolbar--lost">
    <a class="lockup" href="/" aria-label="Stefano Doko, front page" data-i18n-attr="aria-label:lockupLabel" data-home>
      <span class="lockup__name">Stefano Doko</span>
      <span class="lockup__role"><svg class="orn"><use href="#star"/></svg><span data-i18n="role">Designer &amp; developer</span><svg class="orn"><use href="#star"/></svg></span>
    </a>
    <span></span>
    <a class="btn btn--ink" href="mailto:hello@example.invalid" data-mail><span data-i18n="cta">Write to Stefano</span><svg class="hand" aria-hidden="true"><use href="#hand"/></svg></a>
  </header>
  <main class="lost__main" id="main">
    <h1 class="lost__code" aria-label="404, sheet not found" data-i18n-attr="aria-label:lostLabel">404</h1>
    <p class="lost__line" data-i18n="notFoundLine">The press dropped this sheet on the floor.</p>
    <div class="pie" data-pie aria-hidden="true"></div>
    <p class="sr-only" data-i18n="notFound">Sheet not found</p>
    <div class="lost__actions">
      <button class="btn btn--line" type="button" data-set><span data-i18n="setAgain">Set it again</span></button>
      <a class="btn btn--ink" href="/" data-home><span data-i18n="toFront">Back to the front page</span><svg class="hand" aria-hidden="true"><use href="#hand"/></svg></a>
    </div>
    <nav class="lost__pages" aria-label="Pages" data-i18n-attr="aria-label:pagesLabel">
      <a class="word" href="/work/" data-route="work" data-i18n="navWork">Work</a>
      <a class="word" href="/about/" data-route="about" data-i18n="navAbout">About</a>
      <a class="word" href="/services/" data-route="services" data-i18n="navServices">Services</a>
      <a class="word" href="/contact/" data-route="contact" data-i18n="navContact">Contact</a>
    </nav>
  </main>
  <script type="module" src="/src/notfound.js"></script>
</body>
</html>
