<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Stefano Doko — Logo</title>
<style>
@font-face { font-family: 'Anybody'; src: url('../public/fonts/Anybody-VF.woff2') format('woff2'); font-weight: 100 900; font-stretch: 50% 150%; }
@font-face { font-family: 'Old Standard'; src: url('../public/fonts/OldStandard-Italic.woff2') format('woff2'); font-style: italic; }
:root { --paper: #EFE6D2; --aged: #E3D6BA; --ink: #141414; --fade: #5F584F; --alarm: #E23B2E; }
* { box-sizing: border-box; margin: 0; }
body { width: 1600px; background: var(--paper); color: var(--ink); padding: 56px 64px 64px; font: italic 20px/1.3 'Old Standard', serif; }
.label { font: 800 15px/1 'Anybody', sans-serif; font-stretch: 90%; letter-spacing: .08em; text-transform: uppercase; font-style: normal; }
.slug { display: flex; justify-content: space-between; border-bottom: 3px solid var(--ink); padding-bottom: 12px; }
.grid { display: grid; grid-template-columns: 620px 1fr; gap: 56px; padding-top: 40px; }
.cell { border-top: 2px solid var(--ink); padding-top: 14px; }
.cell p { margin-top: 10px; }
.seal img { width: 620px; height: 620px; display: block; margin-top: 20px; }
.right { display: grid; gap: 40px; align-content: start; }
.word img { height: 170px; display: block; margin-top: 20px; }
.ink { background: var(--ink); color: var(--paper); border-radius: 10px; padding: 28px; margin-top: 20px; }
.ink img { height: 150px; display: block; }
.row { display: flex; align-items: end; gap: 36px; margin-top: 20px; }
.row figure { margin: 0; text-align: center; }
.row figcaption { margin-top: 8px; font-size: 16px; }
.tabs { display: flex; gap: 14px; margin-top: 20px; }
.tab { display: flex; align-items: center; gap: 8px; background: #DAD3C3; border-radius: 8px 8px 0 0; padding: 8px 14px; font: 14px/1 system-ui, sans-serif; font-style: normal; color: #222; }
.avatar { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; }
.avatar img { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="slug label"><span>Stefano Doko</span><span>Logo · prova për shtyp</span><span>Shqipëri</span></div>
  <div class="grid">
    <section class="cell seal">
      <span class="label">1 · Vula e shtypit (kryesore)</span>
      <img src="logo-seal.svg" alt="">
      <p>Vula në të kuqe alarmi: unaza me Anybody, SD me Ultra dhe pllaka e bojës jashtë regjistrit.</p>
    </section>
    <div class="right">
      <section class="cell word">
        <span class="label">2 · Emri me vulë</span>
        <img src="logo-wordmark-paper.svg" alt="">
        <div class="ink"><img src="logo-wordmark-ink.svg" alt=""></div>
      </section>
      <section class="cell">
        <span class="label">3 · Madhësitë e vogla</span>
        <div class="row">
          <figure><div class="avatar"><img src="logo-seal-simple.svg" alt=""></div><figcaption>Instagram</figcaption></figure>
          <figure><img src="logo-seal-simple.svg" width="96" height="96" alt=""><figcaption>96 px</figcaption></figure>
          <figure><img src="logo-mono.svg" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
          <figure><img src="logo-mono.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
          <figure><img src="logo-mono.svg" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
        </div>
        <div class="tabs">
          <div class="tab"><img src="logo-mono.svg" width="16" height="16" alt="">Stefano Doko, dizajner grafik</div>
          <div class="tab"><img src="logo-seal-simple.svg" width="16" height="16" alt="">Stefano Doko</div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
