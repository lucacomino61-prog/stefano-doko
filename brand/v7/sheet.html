<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stefano Doko — v7 marks</title>
<style>
@font-face { font-family: 'Inter'; src: url('../v5/fonts-src/Inter-VF-latin.woff2') format('woff2'); font-weight: 100 900; }
:root { --paper: #EFE6D2; --ink: #141414; }
* { box-sizing: border-box; margin: 0; }
body { width: 1600px; background: #F7F4EC; color: var(--ink); padding: 56px 64px 64px; font: 400 17px/1.45 'Inter', sans-serif; }
.label { font: 600 13px/1 'Inter', sans-serif; letter-spacing: .06em; text-transform: uppercase; }
.slug { display: flex; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
h2.d { margin-top: 40px; border-top: 1px solid var(--ink); padding-top: 14px; }
.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px; margin-top: 18px; }
figure { margin: 0; }
.big { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; }
.tiny { display: flex; gap: 14px; align-items: end; margin-top: 12px; }
.tiny img { border-radius: 6px; }
figcaption { margin-top: 10px; }
figcaption b { display: block; margin-bottom: 6px; }
</style></head><body>
<div class="slug label"><span>Stefano Doko</span><span>v7 · nine marks, one idea each</span><span>Albania</span></div>
<h2 class="label d">Sagi Haviv</h2><div class="row"><figure><img class="big" src="haviv-crop-paper.svg" alt=""><div class="tiny"><img src="haviv-crop-paper.svg" width="64" height="64" alt=""><img src="haviv-crop-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Crop marks</b> Framing what matters: the trim marks every print job starts with, around one red dot.</figcaption></figure><figure><img class="big" src="haviv-bezier-paper.svg" alt=""><div class="tiny"><img src="haviv-bezier-paper.svg" width="64" height="64" alt=""><img src="haviv-bezier-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">The path</b> The S drawn as a vector path, anchors and one red handle showing: the tool is the mark.</figcaption></figure><figure><img class="big" src="haviv-register-paper.svg" alt=""><div class="tiny"><img src="haviv-register-paper.svg" width="64" height="64" alt=""><img src="haviv-register-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Registration</b> The printer’s mark, ink and red plates a hair out of register: made by hand, on purpose.</figcaption></figure></div><h2 class="label d">Michael Bierut</h2><div class="row"><figure><img class="big" src="bierut-eyes-paper.svg" alt=""><div class="tiny"><img src="bierut-eyes-paper.svg" width="64" height="64" alt=""><img src="bierut-eyes-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Looking</b> doko, and its two o’s are looking at you: a designer’s eye, literally.</figcaption></figure><figure><img class="big" src="bierut-bubble-paper.svg" alt=""><div class="tiny"><img src="bierut-bubble-paper.svg" width="64" height="64" alt=""><img src="bierut-bubble-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Say it</b> SD, and the D is a speech bubble: the whole site asks you to write to Stefano.</figcaption></figure><figure><img class="big" src="bierut-swatch-paper.svg" alt=""><div class="tiny"><img src="bierut-swatch-paper.svg" width="64" height="64" alt=""><img src="bierut-swatch-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Doko Red</b> A colour chip for a colour called Doko Red: his own red, named like an ink.</figcaption></figure></div><h2 class="label d">Experimental Jetset</h2><div class="row"><figure><img class="big" src="jetset-stop-paper.svg" alt=""><div class="tiny"><img src="jetset-stop-paper.svg" width="64" height="64" alt=""><img src="jetset-stop-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Full stop</b> stefano doko. The red full stop is the only decoration: said, done.</figcaption></figure><figure><img class="big" src="jetset-select-paper.svg" alt=""><div class="tiny"><img src="jetset-select-paper.svg" width="64" height="64" alt=""><img src="jetset-select-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Selected</b> The name selected, as in every design app: the thing being worked on.</figcaption></figure><figure><img class="big" src="jetset-cursor-paper.svg" alt=""><div class="tiny"><img src="jetset-cursor-paper.svg" width="64" height="64" alt=""><img src="jetset-cursor-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Typing</b> The name still being typed, the cursor in red: always working.</figcaption></figure></div>
</body></html>
