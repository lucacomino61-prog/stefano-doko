<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stefano Doko — v8 marks</title>
<style>
@font-face { font-family: 'Inter'; src: url('../v5/fonts-src/Inter-VF-latin.woff2') format('woff2'); font-weight: 100 900; }
:root { --paper: #EFE6D2; --ink: #141414; }
* { box-sizing: border-box; margin: 0; }
body { width: 1600px; background: #F7F4EC; color: var(--ink); padding: 56px 64px 64px; font: 400 17px/1.45 'Inter', sans-serif; }
.label { font: 600 13px/1 'Inter', sans-serif; letter-spacing: .06em; text-transform: uppercase; }
.slug { display: flex; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
h2.d { margin-top: 40px; border-top: 1px solid var(--ink); padding-top: 14px; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; margin-top: 18px; }
figure { margin: 0; }
.big { max-width: 560px; width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; }
.tiny { display: flex; gap: 14px; align-items: end; margin-top: 12px; }
.tiny img { border-radius: 6px; }
figcaption { margin-top: 10px; }
figcaption b { display: block; margin-bottom: 6px; }
</style></head><body><div class="slug label"><span>Stefano Doko</span><span>v8 · eight marks, one idea each</span><span>Albania</span></div><h2 class="label d">Noma Bar</h2><div class="row"><figure><img class="big" src="bar-eye-paper.svg" alt=""><div class="tiny"><img src="bar-eye-paper.svg" width="64" height="64" alt=""><img src="bar-eye-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Sunset eye</b> An eye whose iris is the sun going down on the sea: how a designer sees the coast.</figcaption></figure><figure><img class="big" src="bar-nib-paper.svg" alt=""><div class="tiny"><img src="bar-nib-paper.svg" width="64" height="64" alt=""><img src="bar-nib-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Nib cone</b> A fountain-pen nib that is also an ice-cream cone: the tool, and a client’s ice cream.</figcaption></figure></div><h2 class="label d">Shigeo Fukuda</h2><div class="row"><figure><img class="big" src="fukuda-sunset-paper.svg" alt=""><div class="tiny"><img src="fukuda-sunset-paper.svg" width="64" height="64" alt=""><img src="fukuda-sunset-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Sideways</b> SD turned on its side: the D is a sun setting on the S’s wave. Tilt your head to read it.</figcaption></figure><figure><img class="big" src="fukuda-drop-paper.svg" alt=""><div class="tiny"><img src="fukuda-drop-paper.svg" width="64" height="64" alt=""><img src="fukuda-drop-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">The drop</b> The D turned and pinched into a drop of ink, with an S cut out of it.</figcaption></figure></div><h2 class="label d">Lindon Leader</h2><div class="row"><figure><img class="big" src="leader-s-paper.svg" alt=""><div class="tiny"><img src="leader-s-paper.svg" width="64" height="64" alt=""><img src="leader-s-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Inside</b> A red D whose counter is an S: both initials, one shape.</figcaption></figure><figure><img class="big" src="leader-nib-paper.svg" alt=""><div class="tiny"><img src="leader-nib-paper.svg" width="64" height="64" alt=""><img src="leader-nib-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Hidden nib</b> A black D whose counter is a pen nib: the tool, hiding in the letter.</figcaption></figure></div><h2 class="label d">Build</h2><div class="row"><figure><img class="big" src="build-dots-paper.svg" alt=""><div class="tiny"><img src="build-dots-paper.svg" width="64" height="64" alt=""><img src="build-dots-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Dot grid</b> SD on a dot grid, one dot red: the full stop.</figcaption></figure><figure><img class="big" src="build-lines-paper.svg" alt=""><div class="tiny"><img src="build-lines-paper.svg" width="64" height="64" alt=""><img src="build-lines-paper.svg" width="32" height="32" alt=""></div><figcaption><b class="label">Engraved</b> SD cut in horizontal rules, like the engraved band on the site.</figcaption></figure></div></body></html>
