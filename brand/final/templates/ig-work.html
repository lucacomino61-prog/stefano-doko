<!doctype html><html lang="sq"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
.frame { width: 1080px; height: 1350px; padding: 80px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto 1fr auto; gap: 0 56px; }
.top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
.top img { height: 72px; }
.copy { align-self: end; padding-bottom: 12px; }
.copy .eyebrow { color: var(--red); }
h2 { font-weight: 700; font-size: 128px; line-height: .9; letter-spacing: -0.05em; margin-top: 18px; }
.copy p { font-size: 36px; line-height: 1.25; letter-spacing: -0.015em; margin-top: 28px; }
.phone { align-self: center; border-radius: 44px; overflow: hidden; border: 8px solid var(--ink); height: 860px; }
.phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.foot { grid-column: 1 / -1; display: flex; justify-content: space-between; font-weight: 500; font-size: 30px; border-top: 3px solid var(--ink); padding-top: 26px; margin-top: 48px; }
</style></head><body>
<div class="frame cream">
  <div class="top"><img src="../logo/mark-red.svg" alt=""><span class="eyebrow">Puna</span></div>
  <div class="copy"><span class="eyebrow">Parfumeri online</span><h2>Elixir</h2><p>Aroma designer, arabe dhe nishe, me dërgesë në gjithë Shqipërinë.</p></div>
  <div class="phone"><img src="../../../public/work/elixir-phone.jpg" alt=""></div>
  <div class="foot"><span>elixir.al</span><span>Stefano Doko</span></div>
</div></body></html>
